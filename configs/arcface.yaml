seed: 42
datamodule:
  data_name: mnist
  n_classes: 8
  batch_size: 512
  num_workers: 8
pl_module:
  header: arcface
  embed_dim: 3
  lr: 0.01
  s: 1.0
  m: 0.5
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: 32-true
  fast_dev_run: false
  max_epochs: 20
  max_steps: -1
  overfit_batches: 0.0
  check_val_every_n_epoch: 1
  log_every_n_steps: 50
  enable_checkpointing: true
  accumulate_grad_batches: 1
  inference_mode: true
  use_distributed_sampler: true
  detect_anomaly: false
  barebones: false
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
